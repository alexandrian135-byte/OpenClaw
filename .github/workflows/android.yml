name: Build Android 15 APK 64bit
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Java 17 for Android 15
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Setup Android SDK for Android 15
        uses: android-actions/setup-android@v3
      - name: Build for Android 15 and old versions
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DANDROID_MIN_SDK=21 -DANDROID_TARGET_SDK=35 ..
          make -j4
          echo "Build done - works on Android 5 to Android 15"
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android15-64bit
          path: build/
