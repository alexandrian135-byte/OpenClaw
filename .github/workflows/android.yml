name: Build Android 15 APK 64bit
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libtinyxml2-dev
      - name: Build 64bit
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android15-64bit
          path: build/OpenClaw
