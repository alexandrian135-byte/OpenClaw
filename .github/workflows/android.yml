
name: Build Android 15 APK 64bit

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Download official SDL2
        run: |
          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git android/sdl2
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R android/sdl2/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/

      - name: Build ARM64 APK
        run: |
          gradle -p android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawEngine-ARM64-APK
          path: android/app/build/outputs/apk/debug/*.apk
