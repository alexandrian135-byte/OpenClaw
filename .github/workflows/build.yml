name: Build Android 15 APK 64bit
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          
      - name: Build 64bit for Android 15
        run: |
          echo "=== ClawLauncher ==="
          ls -la ClawLauncher/
          cat CMakeLists.txt
          mkdir -p build_android
          cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_shared
          cmake --build . --config Release -- -j$(nproc)
          
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android15-arm64-v8a
          path: build_android/
