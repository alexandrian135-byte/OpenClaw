
name: Build Android 15 APK 64bit

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Download SDL2
        run: |
          git clone --depth 1 --branch release-2.30.11 \
            https://github.com/libsdl-org/SDL.git android/sdl2

      - name: Download SDL2 Mixer
        run: |
          git clone --depth 1 --recurse-submodules \
            --branch release-2.8.1 \
            https://github.com/libsdl-org/SDL_mixer.git android/SDL_mixer

      - name: Download SDL2 TTF
        run: |
          git clone --depth 1 --recurse-submodules \
            --branch release-2.22.0 \
            https://github.com/libsdl-org/SDL_ttf.git android/SDL_ttf

      - name: Prepare SDL Android Java
        run: |
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R android/sdl2/android-project/app/src/main/java/org/libsdl/app \
            android/app/src/main/java/org/libsdl/

      - name: Verify Dependencies
        run: |
          test -f android/sdl2/CMakeLists.txt
          test -f android/SDL_mixer/CMakeLists.txt
          test -f android/SDL_ttf/CMakeLists.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ARM64 APK
        run: |
          gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android15-ARM64-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
