name: Build Android 15 APK 64bit
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          GRADLE=$(find . -name gradlew -type f | head -n 1)
          echo "Found gradle at: $GRADLE"
          cd $(dirname $GRADLE)
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-APK-Android15-64bit
          path: "**/app/build/outputs/apk/debug/*.apk"
