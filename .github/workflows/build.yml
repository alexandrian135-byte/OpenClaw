name: Build Android 15 APK 64bit
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Tree
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== FIND ALL FILES ==="
          find . -maxdepth 4 -type f | head -n 100
          echo "=== LOOK FOR ANDROID ==="
          ls -la apps/ 2>&1 || echo "no apps folder"
          ls -la android/ 2>&1 || echo "no android folder"
