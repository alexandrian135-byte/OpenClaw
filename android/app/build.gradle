plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openclaw.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.openclaw.game'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
                arguments '-DAndroid=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
